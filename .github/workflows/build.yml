# Builds and tests BreezeCAD on Windows, macOS and Linux.
# The Windows job also publishes a ready-to-run archive (exe + DLLs + assets):
# as a workflow artifact (Actions → the run → Artifacts → BreezeCAD-windows)
# and, for pushes to `next` that pass the tests, as the pre-release
# "next-build" on the Releases page — a stable link to the freshest build.
name: build

# Private repository: Actions minutes are counted (Windows x2, macOS x10), so
# documentation-only pushes build nothing and macOS builds only on request
# (Actions → build → Run workflow).
on:
  push:
    branches: [next, main]
    paths-ignore: ['docs/**', 'translations/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', 'translations/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # to update the next-build pre-release
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-opencascade
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gdb
            zip
      - name: Versions
        run: |
          g++ --version | head -1
          cmake --version | head -1
          grep -h "define OCC_VERSION_COMPLETE" /mingw64/include/opencascade/Standard_Version.hxx
      - name: Configure
        run: OCCT_DIR=/mingw64/lib/cmake/opencascade cmake --preset windows-mingw
      - name: Build
        id: build
        run: cmake --build --preset windows-mingw 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Test
        run: |
          set +e +o pipefail   # the msys2 shell runs with -e: keep going to name the crash
          ctest --preset windows-mingw --output-on-failure 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # A crash prints no failed check: run again, naming each finished test case.
          if [ $status -ne 0 ]; then
            exe=$(find build/windows-mingw -name bz_tests.exe | head -1)
            "$exe" -d 2>&1 | grep -vE "WARN|INFO|^$|^=+$" | tail -12 | sed 's/^/last cases: /' | tee -a test.log
            # Each test case alone: names every one that crashes.
            "$exe" -ltc --no-version 2>/dev/null | grep -vE "^\[doctest\]|^=+$|^$" | while IFS= read -r name; do
              "$exe" -tc="${name//,/\\,}" >/dev/null 2>&1 || echo "crashes or fails: $name"
            done | tee -a test.log
            # And once more under gdb for the backtrace of the first crash (frames only).
            gdb -batch -ex run -ex bt --args "$exe" 2>&1 | grep -E "^#[0-9]+ " | head -40 \
              | sed -E 's/^(#[0-9]+) +0x[0-9a-f]+ in /\1 /; s/ from .*//' | sed 's/^/gdb: /' | tee -a test.log
          fi
          exit $status
      - name: Report failures
        if: failure()
        run: bash scripts/ci-annotate.sh build.log test.log
      - name: Package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p dist/BreezeCAD
          cp -r build/windows-mingw/bin/breezecad.exe build/windows-mingw/bin/assets dist/BreezeCAD/
          bash scripts/deploy-runtime.sh dist/BreezeCAD breezecad.exe /mingw64/bin
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: BreezeCAD-windows
          path: dist/BreezeCAD
          retention-days: 30
      - name: Publish the next-build pre-release
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/next' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && 7z a -tzip -bso0 BreezeCAD-windows.zip BreezeCAD && cd ..
          notes="Свежая сборка ветки next: коммит ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M') UTC. Распаковать и запустить BreezeCAD/breezecad.exe."
          if ! gh release view next-build >/dev/null 2>&1; then
            gh release create next-build --prerelease --target "$GITHUB_SHA" --title "BreezeCAD — свежая сборка (next)" --notes "$notes"
          fi
          gh release upload next-build dist/BreezeCAD-windows.zip --clobber
          gh release edit next-build --notes "$notes"

  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install ninja glfw opencascade
      - name: Configure
        run: cmake --preset macos -DCMAKE_PREFIX_PATH="$(brew --prefix)"
      - name: Build
        run: cmake --build --preset macos 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Test
        run: ctest --preset macos --output-on-failure 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Report failures
        if: failure()
        run: bash scripts/ci-annotate.sh build.log test.log

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libglfw3-dev libgl1-mesa-dev \
            libocct-foundation-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev \
            libocct-visualization-dev libocct-data-exchange-dev libocct-ocaf-dev \
            libfreetype-dev libfontconfig1-dev libtbb-dev
      - name: Configure
        run: cmake --preset linux-release
      - name: Build
        run: cmake --build --preset linux-release 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Test
        run: ctest --preset linux-release --output-on-failure 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Report failures
        if: failure()
        run: bash scripts/ci-annotate.sh build.log test.log
