# Android (docs/ADR/0004-mobile-touch-ui.md, docs/dev/MOBILE-PORT.md): the
# core with its unit tests and the app (src/android) packed into an APK.
#
#   arm64-v8a  phones: built; BreezeCAD-android.apk goes to the pre-release
#              "android-build" (a stable link to download on the phone) — or,
#              from a branch preview/android-N, to its own pre-release
#              "android-preview-N" that nothing else overwrites (a version
#              kept, not in main: the author, 2026-10-17); the
#              staged tests are the artifact "bz-tests-android-arm64"
#   x86_64     built the same way and run on an Android emulator — the unit
#              tests, then the APK (starts, builds the example, survives a
#              swipe; screenshots go with the release): GitHub's runners cannot
#              run arm64 code
#
# The APK is signed with the secret ANDROID_KEYSTORE_BASE64 (+ _PASSWORD):
# the same key every time, so a new APK installs over the old one. Without
# it — a throwaway key, and the old app must be removed first.
#
# FreeType and OCCT for Android come from scripts/android/build-deps.sh
# (about an hour per ABI the first time) and stay in the Actions cache.
#
# Separate from build.yml on purpose: it never holds up or breaks the
# desktop builds and their release "next-build".
name: android

on:
  push:
    branches: [next, main, 'ci/android-*', 'feat/android-*', 'preview/android-*']
    paths-ignore: ['docs/**', 'translations/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', 'translations/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: r27c   # LTS; part of the cache key
  BUNDLETOOL_VERSION: 1.17.2   # makes the .aab for Google Play

jobs:
  build:
    name: build (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      BZ_ANDROID_DEPS: ${{ github.workspace }}/.android-deps/${{ matrix.abi }}
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "::notice title=Android toolchain::NDK $NDK_VERSION ($(grep Pkg.Revision ${{ steps.ndk.outputs.ndk-path }}/source.properties | cut -d= -f2 | tr -d ' ')), CMake $(cmake --version | head -1 | awk '{print $3}')"
      - name: Restore FreeType and OCCT
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BZ_ANDROID_DEPS }}
          key: android-deps-${{ matrix.abi }}-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/android/build-deps.sh') }}
      - name: Build FreeType and OCCT (first run, about an hour)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          set +e
          bash scripts/android/build-deps.sh ${{ matrix.abi }} "$BZ_ANDROID_DEPS" > deps.log 2>&1
          status=$?
          tail -3 deps.log
          exit $status
      # Saved before BreezeCAD builds: a failing BreezeCAD build must not
      # cost the hour of OCCT again.
      - name: Save FreeType and OCCT
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BZ_ANDROID_DEPS }}
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Configure
        run: |
          preset=android-${{ matrix.abi == 'arm64-v8a' && 'arm64' || 'x86_64' }}
          echo "PRESET=$preset" >> "$GITHUB_ENV"
          set +e
          cmake --preset $preset > configure.log 2>&1
          status=$?
          grep -E "OpenCASCADE|Android|Error" configure.log | head -5
          exit $status
      - name: Build
        run: |
          set +e
          cmake --build --preset $PRESET -j 3 > build.log 2>&1
          status=$?
          tail -3 build.log
          exit $status
      - name: Stage the tests
        run: |
          bash scripts/android/stage-tests.sh build/$PRESET "$BZ_ANDROID_DEPS" ${{ matrix.abi }} stage
          file stage/bz_tests
          echo "::notice title=Android ${{ matrix.abi }}::bz_tests $(du -h stage/bz_tests | cut -f1), staged $(du -sh stage | cut -f1): $(file -b stage/bz_tests | cut -d, -f1-2)"
      - name: Package the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BZ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BZ_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ "${{ matrix.abi }}" = arm64-v8a ]; then
            # The phones' build is also packed as a bundle for Google Play (not published).
            curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
              "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
            export BZ_BUNDLETOOL="$RUNNER_TEMP/bundletool.jar" BZ_AAB="$PWD/apk/BreezeCAD-android.aab"
          fi
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bz.p12"
            export BZ_KEYSTORE="$RUNNER_TEMP/bz.p12"
          else
            echo "::warning title=APK signature::no ANDROID_KEYSTORE_BASE64 secret: a throwaway key — remove the old app before installing"
          fi
          set +e
          bash scripts/android/package-apk.sh build/$PRESET "$BZ_ANDROID_DEPS" ${{ matrix.abi }} apk/BreezeCAD-android-${{ matrix.abi }}.apk > apk.log 2>&1
          status=$?
          tail -3 apk.log
          echo "::notice title=APK ${{ matrix.abi }}::$(grep -E '^(APK|AAB):' apk.log | tr '\n' ' ' | grep . || echo "no output, exit $status")"
          rm -f "$RUNNER_TEMP/bz.p12"
          exit $status
      - name: Report failures
        if: failure()
        run: bash scripts/ci-annotate.sh deps.log configure.log build.log apk.log
      - uses: actions/upload-artifact@v4
        with:
          name: bz-tests-android-${{ matrix.abi == 'arm64-v8a' && 'arm64' || 'x86_64' }}
          path: stage
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: BreezeCAD-android-${{ matrix.abi }}
          path: apk
          retention-days: 14

  test:
    # The x86_64 build on an emulator (Android 11, KVM on the runner).
    name: test (x86_64 emulator)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bz-tests-android-x86_64
          path: stage
      - uses: actions/download-artifact@v4
        with:
          name: BreezeCAD-android-x86_64
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The runner's script runs line by line, so the whole run is one script.
      - name: Run bz_tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android/run-tests.sh stage > test.log 2>&1; status=$?; tail -5 test.log; echo "::notice title=bz_tests on Android x86_64::$(grep -m1 '^device:' test.log) — $(grep -E '^\[doctest\] (test cases|assertions)' test.log | tr '\n' ' ')"; bash scripts/android/smoke-apk.sh apk/BreezeCAD-android-x86_64.apk shots > smoke.log 2>&1; smoke=$?; cat smoke.log; echo "::notice title=APK on the emulator::$(grep -E '^(screen|step|smoke|touch)' smoke.log | tr '\n' ' ')"; exit $((status | smoke))
      - name: Report failures
        if: failure()
        run: bash scripts/ci-annotate.sh test.log smoke.log shots/errors.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-shots
          path: shots
          retention-days: 14

  publish:
    # A push or manual run refreshes the pre-release "android-build" as soon
    # as the phone APK is built (the author installs it at once; 2026-10-16).
    # The emulator runs meanwhile: its screenshots follow in "publish-shots".
    needs: [build]
    if: ${{ github.event_name != 'pull_request' }}   # push or a manual run
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: BreezeCAD-android-arm64-v8a, path: release }
      - name: Publish the APK to android-build
        if: ${{ !startsWith(github.ref_name, 'preview/android-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv release/BreezeCAD-android-arm64-v8a.apk release/BreezeCAD-android.apk
          notes="Сборка для Android: ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, версия ${{ github.run_number }}, $(date -u '+%Y-%m-%d %H:%M') UTC.

          BreezeCAD-android.apk — телефоны и планшеты на ARM (64-бит), Android 9 и новее.
          BreezeCAD-android.aab — пакет для будущей публикации в Google Play (ставить на телефон не нужно).
          Установка: открыть ссылку на телефоне → скачать → открыть файл → разрешить установку из этого источника.
          Новая версия ставится поверх прежней (если сборка подписана постоянным ключом).

          APK выкладывается сразу после сборки; проверка на эмуляторе идёт следом,
          её снимки (emulator-*.png) появятся здесь, если она прошла: главная, деталь,
          поворот, эскиз с курсором, левша, планшет, видовой куб."
          if ! gh release view android-build >/dev/null 2>&1; then
            gh release create android-build --prerelease --target "$GITHUB_SHA" --title "BreezeCAD для Android — свежая сборка" --notes "$notes"
          fi
          # Pictures of an older build would mislead: they go until this one's arrive.
          for old in $(gh release view android-build --json assets --jq '.assets[].name' | grep '^emulator-'); do
            gh release delete-asset android-build "$old" -y || true
          done
          gh release upload android-build release/BreezeCAD-android.apk release/BreezeCAD-android.aab --clobber
          gh release edit android-build --notes "$notes"
      - name: Keep a preview version in its own pre-release
        # Branch preview/android-N → pre-release and tag android-preview-N at
        # this commit. Nothing else writes there: the version stays as it was.
        if: ${{ startsWith(github.ref_name, 'preview/android-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          n="${GITHUB_REF_NAME#preview/android-}"
          rel="android-preview-$n"
          mv release/BreezeCAD-android-arm64-v8a.apk "release/BreezeCAD-android-preview-$n.apk"
          mv release/BreezeCAD-android.aab "release/BreezeCAD-android-preview-$n.aab" 2>/dev/null || true
          notes="Сохранённая предварительная версия BreezeCAD для Android №$n (не в main): ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}, сборка ${{ github.run_number }}, $(date -u '+%Y-%m-%d %H:%M') UTC.

          Эта страница больше не обновляется — свежие сборки в android-build.
          Установка: открыть ссылку на телефоне → скачать APK → открыть файл. Подписана постоянным ключом — ставится поверх."
          if ! gh release view "$rel" >/dev/null 2>&1; then
            gh release create "$rel" --prerelease --target "$GITHUB_SHA" --title "BreezeCAD для Android — предварительная версия $n" --notes "$notes"
          fi
          gh release upload "$rel" release/BreezeCAD-android-preview-* --clobber

  publish-shots:
    # The emulator passed: its screenshots next to the APK.
    needs: [publish, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: android-emulator-shots, path: shots }
      - name: Add the emulator's screenshots to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rel=android-build
          case "$GITHUB_REF_NAME" in preview/android-*) rel="android-preview-${GITHUB_REF_NAME#preview/android-}" ;; esac
          mkdir -p up
          for f in shots/*.png; do cp "$f" "up/emulator-$(basename "$f")"; done
          gh release upload "$rel" up/*.png --clobber
