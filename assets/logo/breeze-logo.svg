<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="breezeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CC8FF"/>
      <stop offset="100%" stop-color="#00D9C0"/>
    </linearGradient>
  </defs>

  <!-- Внешняя окружность -->
  <circle cx="32" cy="32" r="27"
          fill="none"
          stroke="url(#breezeGrad)"
          stroke-width="2.6"/>

  <!-- Верхняя волна — короткая -->
  <path d="M 18 25 C 23 21, 28 21, 32 25 C 35 28, 39 28, 43 25"
        fill="none"
        stroke="url(#breezeGrad)"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Средняя волна — длинная, главная -->
  <path d="M 14 33 C 20 28, 26 28, 32 33 C 38 38, 44 38, 50 33"
        fill="none"
        stroke="url(#breezeGrad)"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Нижняя волна — короткая, сдвинута вправо -->
  <path d="M 20 42 C 24 38, 28 38, 32 42 C 35 45, 38 45, 41 42"
        fill="none"
        stroke="url(#breezeGrad)"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
